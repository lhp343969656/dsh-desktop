name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Runtime 里的 dsh 版本（打包脚本从 npm 安装，不依赖本地工作区）
  DSH_NPM_PACKAGE: '@deepseek-ai/dsh@0.1.0-rc.6'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build bundled runtime
        run: node scripts/build-runtime.mjs
      - name: Smoke test runtime
        run: node scripts/smoke-runtime.mjs
      - name: Build installer
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  macos-x64:
    runs-on: macos-13
    # Intel 运行器排队严重，公开发布不依赖它；能出就出
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build bundled runtime
        run: node scripts/build-runtime.mjs
      - name: Smoke test runtime
        run: node scripts/smoke-runtime.mjs
      - name: Build DMG
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build bundled runtime
        run: node scripts/build-runtime.mjs
      - name: Smoke test runtime
        run: node scripts/smoke-runtime.mjs
      - name: Build DMG
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
